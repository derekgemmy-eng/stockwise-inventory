services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-stockwise}
      DB_USER: ${DB_USER:-stockwise_user}
      DB_PASSWORD: ${DB_PASSWORD:-stockwise_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-stockwise}
      MYSQL_USER: ${DB_USER:-stockwise_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockwise_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    volumes:
      - stockwise_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  stockwise_data:
